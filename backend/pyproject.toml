[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "study-invest"
version = "0.1.0"
description = "공부장려 모의투자 이벤트 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    # 테스트 클라이언트(fastapi.testclient). Starlette는 1.2부터 httpx2를 쓰고 httpx는 deprecated.
    "httpx2>=2.13",
    "starlette>=1.2",
]

[project.scripts]
study-invest = "study_invest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/study_invest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 닫지 않은 DB 연결·파일 같은 자원 누수는 경고로 흘려보내지 않고 테스트 실패로 드러낸다.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

