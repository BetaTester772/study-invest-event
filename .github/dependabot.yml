# 의존성 업데이트 PR. 모든 PR은 CI(.github/workflows/ci.yml)를 통과해야 머지할 수 있다.
# 사소한 업데이트(minor·patch)는 생태계마다 한 PR로 묶고, major는 따로 연다.
version: 2

updates:
  # 백엔드 Python 패키지 (backend/pyproject.toml + backend/uv.lock).
  # 설치는 CI·이미지 모두 uv.lock 그대로 하므로, 업데이트는 lock을 고치는 PR로만 들어온다.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # 프론트엔드 npm 패키지 (frontend/package-lock.json)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Dockerfile 베이스 이미지
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /infra/pgbouncer
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # 런타임 버전은 CI(PYTHON_VERSION·NODE_VERSION)와 함께 의도적으로 올린다.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  # docker-compose.yml 이미지(postgres, pgadmin). pgAdmin은 CI compose 작업에서 실제로 띄워 확인한다.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    commit-message:
      prefix: "deps(compose)"
    ignore:
      # PostgreSQL major 업그레이드는 데이터 디렉터리 이전(pg_upgrade/덤프)이 필요하다.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # pgAdmin은 정식 릴리스(9.x) 외에 날짜 태그(2026-09-15-1 등) 개발 빌드도 올린다.
      # 날짜를 버전으로 읽으면 가장 큰 값이 되므로 제외한다.
      - dependency-name: dpage/pgadmin4
        versions: [">= 1000"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
